<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <!-- 1. 引入 Cloudflare Turnstile 官方 JS 库 -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding-top: 100px;
            color: #333;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #turnstile-container {
            margin-top: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="content">
        <h2>Initializing page...</h2>
        <div class="loader"></div>
    </div>

    <!-- 隐藏的 Turnstile 容器 -->
    <div id="turnstile-container"></div>

    <script>
        // === 配置区域 ===
        const TARGET_COUNTRY = "US, CN"; // 目标国家代码（例如 US 代表美国）
        const TARGET_URL = "https://beegtv.cc"; // 目标国家要跳转的 A 页面
        const TURNSTILE_SITE_KEY = "0x4AAAAAAE-kEL3bYqGeYLn1"; // 替换成Cloudflare中Turnstile创建的Site Key（网站密钥）
        // ================

        async function init() {
            // 防止重复检测
            if (sessionStorage.getItem('checked')) return;

            try {
                // 1. 获取用户 IP 国家
                let res = await fetch('https://ipapi.co/json/');
                let data = await res.json();
                let userCountry = data.country_code;
                
                console.log("当前国家:", userCountry);

                // 2. 判断是否为目标国家
                if (userCountry === TARGET_COUNTRY) {
                    document.getElementById('content').innerHTML = "<h3>安全检查中，请稍候...</h3>";
                    
                    // 是目标国家：渲染机器人检测组件 (Turnstile)
                    // 真人用户通过后会触发 window.onTurnstileSuccess 函数
                    turnstile.render('#turnstile-container', {
                        sitekey: TURNSTILE_SITE_KEY,
                        callback: function(token) {
                            // 验证成功（确认是真人）后执行跳转
                            sessionStorage.setItem('checked', 'true');
                            window.location.href = TARGET_URL;
                        },
                        // 如果想完全无感（Managed模式），大部分真人直接过，机器人过不去
                        execution: "render" 
                    });

                } else {
                    // 非目标国家：直接留在当前页，不加载验证码，也不跳转
                    sessionStorage.setItem('checked', 'true');
                    document.getElementById('content').innerHTML = "<h3>欢迎访问本站！</h3>";
                }

            } catch (e) {
                console.error("初始化出错", e);
                // 接口挂了时默认当普通访客处理，留在当前页
                document.getElementById('content').innerHTML = "<h3>Welcome to this site!</h3>";
            }
        }

        window.onload = init;
    </script>
</body>
</html>
